services:

  # API Gateway (ポート3001)
  api-gateway:
    build:
      context: ../ahamo-dummy-demo2-api-gateway-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONTENT_SERVICE_URL=http://content-service:8082
      - APPLICATION_SERVICE_URL=http://application-service:8083
      - SERVER_PORT=3001
    depends_on:
      - content-service
      - application-service
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - e2e-network

  # Content Service (ポート8082)
  content-service:
    build:
      context: ../ahamo-dummy-demo2-content-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/content_service_db
      - DB_NAME=content_service_db
      - DB_USERNAME=ahamo_user
      - DB_PASSWORD=ahamo_password
      - SERVER_PORT=8082
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - e2e-network

  # Application Service (ポート8083)
  application-service:
    build:
      context: ../ahamo-dummy-demo2-application-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/application_service_db
      - DB_NAME=application_service_db
      - DB_USERNAME=ahamo_user
      - DB_PASSWORD=ahamo_password
      - SERVER_PORT=8083
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - e2e-network

  # Redis (API Gateway用)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - e2e-network

  # PostgreSQL データベース
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ahamo_dummy_demo2
      - POSTGRES_USER=ahamo_user
      - POSTGRES_PASSWORD=ahamo_password
    ports:
      - "5432:5432"
    volumes:
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahamo_user -d ahamo_dummy_demo2"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
